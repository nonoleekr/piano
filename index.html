<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Piano</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Interactive Piano</h1>
            <p class="subtitle">Play with your mouse, touch, or your computer keyboard</p>
        </header>

        <!-- Controls: note labels, sustain, volume, octave shift -->
        <div class="controls">
            <label class="toggle-container">
                <input type="checkbox" id="show-notes" checked>
                <span class="toggle-text">Show Notes</span>
            </label>

            <label class="toggle-container">
                <input type="checkbox" id="sustain-toggle">
                <span class="toggle-text">Sustain</span>
            </label>

            <div class="volume-control">
                <label for="volume" class="toggle-text">Volume</label>
                <input type="range" id="volume" min="0" max="100" value="80" aria-label="Volume">
            </div>

            <div class="octave-control" role="group" aria-label="Octave shift">
                <button type="button" id="octave-down" class="octave-btn" aria-label="Shift octave down">&minus;</button>
                <span id="octave-label" class="octave-label">Octave 3–5</span>
                <button type="button" id="octave-up" class="octave-btn" aria-label="Shift octave up">+</button>
            </div>
        </div>

        <div class="now-playing" aria-hidden="false">
            <span class="now-playing-label">Now playing:</span>
            <span id="now-playing-notes">—</span>
        </div>

        <!-- Main piano container -->
        <div class="piano">
            <!-- White keys section -->
            <div class="white-keys" role="group" aria-label="White piano keys">
                <button type="button" class="key white" data-note="C3" data-key="KeyA" data-key-label="A"><span class="key-shortcut">A</span><span class="note-name">C</span><span class="octave">3</span></button>
                <button type="button" class="key white" data-note="D3" data-key="KeyS" data-key-label="S"><span class="key-shortcut">S</span><span class="note-name">D</span><span class="octave">3</span></button>
                <button type="button" class="key white" data-note="E3" data-key="KeyD" data-key-label="D"><span class="key-shortcut">D</span><span class="note-name">E</span><span class="octave">3</span></button>
                <button type="button" class="key white" data-note="F3" data-key="KeyF" data-key-label="F"><span class="key-shortcut">F</span><span class="note-name">F</span><span class="octave">3</span></button>
                <button type="button" class="key white" data-note="G3" data-key="KeyG" data-key-label="G"><span class="key-shortcut">G</span><span class="note-name">G</span><span class="octave">3</span></button>
                <button type="button" class="key white" data-note="A3" data-key="KeyX" data-key-label="X"><span class="key-shortcut">X</span><span class="note-name">A</span><span class="octave">3</span></button>
                <button type="button" class="key white" data-note="B3" data-key="KeyV" data-key-label="V"><span class="key-shortcut">V</span><span class="note-name">B</span><span class="octave">3</span></button>
                <button type="button" class="key white" data-note="C4" data-key="KeyJ" data-key-label="J"><span class="key-shortcut">J</span><span class="note-name">C</span><span class="octave">4</span></button>
                <button type="button" class="key white" data-note="D4" data-key="KeyK" data-key-label="K"><span class="key-shortcut">K</span><span class="note-name">D</span><span class="octave">4</span></button>
                <button type="button" class="key white" data-note="E4" data-key="KeyL" data-key-label="L"><span class="key-shortcut">L</span><span class="note-name">E</span><span class="octave">4</span></button>
                <button type="button" class="key white" data-note="F4" data-key="Semicolon" data-key-label=";"><span class="key-shortcut">;</span><span class="note-name">F</span><span class="octave">4</span></button>
                <button type="button" class="key white" data-note="G4" data-key="Quote" data-key-label="'"><span class="key-shortcut">'</span><span class="note-name">G</span><span class="octave">4</span></button>
                <button type="button" class="key white" data-note="A4" data-key="KeyM" data-key-label="M"><span class="key-shortcut">M</span><span class="note-name">A</span><span class="octave">4</span></button>
                <button type="button" class="key white" data-note="B4" data-key="Period" data-key-label="."><span class="key-shortcut">.</span><span class="note-name">B</span><span class="octave">4</span></button>
                <button type="button" class="key white" data-note="C5" data-key="Slash" data-key-label="/"><span class="key-shortcut">/</span><span class="note-name">C</span><span class="octave">5</span></button>
            </div>
            <!-- Black keys section -->
            <div class="black-keys" role="group" aria-label="Black piano keys">
                <button type="button" class="key black" data-note="C#3" data-key="KeyW" data-key-label="W"><span class="key-shortcut">W</span><span class="note-name">C#</span><span class="octave">3</span></button>
                <button type="button" class="key black" data-note="D#3" data-key="KeyE" data-key-label="E"><span class="key-shortcut">E</span><span class="note-name">D#</span><span class="octave">3</span></button>
                <button type="button" class="key black" data-note="F#3" data-key="KeyT" data-key-label="T"><span class="key-shortcut">T</span><span class="note-name">F#</span><span class="octave">3</span></button>
                <button type="button" class="key black" data-note="G#3" data-key="KeyZ" data-key-label="Z"><span class="key-shortcut">Z</span><span class="note-name">G#</span><span class="octave">3</span></button>
                <button type="button" class="key black" data-note="A#3" data-key="KeyC" data-key-label="C"><span class="key-shortcut">C</span><span class="note-name">A#</span><span class="octave">3</span></button>
                <button type="button" class="key black" data-note="C#4" data-key="KeyI" data-key-label="I"><span class="key-shortcut">I</span><span class="note-name">C#</span><span class="octave">4</span></button>
                <button type="button" class="key black" data-note="D#4" data-key="KeyO" data-key-label="O"><span class="key-shortcut">O</span><span class="note-name">D#</span><span class="octave">4</span></button>
                <button type="button" class="key black" data-note="F#4" data-key="BracketLeft" data-key-label="["><span class="key-shortcut">[</span><span class="note-name">F#</span><span class="octave">4</span></button>
                <button type="button" class="key black" data-note="G#4" data-key="KeyN" data-key-label="N"><span class="key-shortcut">N</span><span class="note-name">G#</span><span class="octave">4</span></button>
                <button type="button" class="key black" data-note="A#4" data-key="Comma" data-key-label=","><span class="key-shortcut">,</span><span class="note-name">A#</span><span class="octave">4</span></button>
            </div>
        </div>

        <!-- Keyboard instructions -->
        <div class="keyboard-guide">
            <p>Rest your hands on the home row: left hand on <kbd>A</kbd> <kbd>S</kbd> <kbd>D</kbd> <kbd>F</kbd> <kbd>G</kbd>, right hand on <kbd>J</kbd> <kbd>K</kbd> <kbd>L</kbd> <kbd>;</kbd> <kbd>'</kbd> &mdash; <kbd>J</kbd> is Middle C. Black keys sit on the row above; <kbd>Z X C V</kbd> / <kbd>N M , . /</kbd> extend each hand to finish the octave.</p>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
